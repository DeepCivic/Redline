[project]
name = "womblex-ingest"
version = "0.1.0"
description = "womblex document-extraction sidecar for redline: ingest(documents) -> run_id, status(run_id); writes Parquet shards to MinIO under proc/{evaluationId}/."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "boto3>=1.34,<2.0",
    "pydantic>=2.7,<3.0",
    # The Parquet decode behind WOMBLEX_MODE=real. A base dependency, not an
    # extra: the Dockerfile's `sidecar` target installs the base package alone,
    # so an extra would ship a default image that could serve only the stub. The
    # read side of the binding is meant to run wherever pyarrow resolves, engine
    # or no engine.
    "pyarrow>=16,<25",
    # The driver behind both writers into redline's own Postgres — the chunk store
    # and the money-span store. A base dependency, not an extra: the `sidecar`
    # image installs the base package alone and its `/ingest` route projects
    # chunks whenever REDLINE_DATABASE_URL is set, so an extra would ship an image
    # that fails on import the moment a DSN is configured.
    "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
# There is deliberately no `womblex` extra here. The engine publishes no release
# to any index, so a `womblex==X.Y.Z` requirement could never be resolved — every
# image that needs the engine installs it from the services/womblex submodule
# source instead (infra/docker/womblex-money.Dockerfile). A version pin here
# would be a string nothing installs, kept in step with the submodule by hand.
#
# The engine stays out of the API image by DEPLOYMENT CHOICE — heavy
# OCR/tokeniser/model runtime, independently scaled via its own cloud runner —
# not by necessity: the sidecar image is python:3.12-slim, inside womblex's own
# 3.11/3.12 support, so it can be co-located when a lane needs that.
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<0.29",
    # pyarrow is repeated here, not left to the base deps, because
    # `test_real_extractor.py` is gated on it (`importorskip`) and validate.sh
    # installs `[dev]` alone. Without it the real-shard mapping — the half that
    # decodes actual Parquet — reports green by never running, which is how a
    # mapping written against columns womblex does not write survived the suite.
    "pyarrow>=16,<25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
