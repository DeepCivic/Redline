[project]
name = "womblex-ingest"
version = "0.1.0"
description = "womblex document-extraction sidecar for redline: ingest(documents) -> run_id, status(run_id); writes Parquet shards to MinIO under proc/{evaluationId}/."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "boto3>=1.34,<2.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
# The real womblex engine. redline runs it from the engine's OWN image, built
# from the services/womblex submodule by the `womblex` compose service — a
# REQUIRED subsystem kept out of the API image because its runtime is heavy.
# This extra is here so a real-lane test environment can `pip install .[womblex]`
# to exercise the query-embedding half of the binding.
#
# The version MUST track the services/womblex submodule tag — that submodule is
# the schema the shard mapping is written against, and a sidecar embedding
# against a different engine build is the one drift nothing else would catch.
# validate.sh check #13 enforces the two stay equal.
# womblex needs Python 3.11/3.12 (its OCR dep has no 3.10 wheel).
#
# `pyarrow` is what the binding uses to DECODE the Parquet shards the pod landed
# in MinIO (real_extractor.py); it is far lighter than womblex's full OCR/model
# stack, so the read side of the binding runs anywhere pyarrow resolves even when
# the engine itself only runs in its pod.
womblex = [
    "womblex==0.3.0",
    "pyarrow>=16,<25",
]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<0.29",
    # pyarrow is in `dev`, not only in `womblex`, because `test_real_extractor.py`
    # is gated on it (`importorskip`) and validate.sh installs `[dev]` alone. Without
    # it here the real-shard mapping — the half that decodes actual Parquet — reports
    # green by never running, which is how a mapping written against columns womblex
    # does not write survived the suite. The engine itself stays in `[womblex]`.
    "pyarrow>=16,<25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
