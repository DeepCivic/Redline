# CI — the same gate as ./validate.sh, run on a real Node runner.
#
# redline consumes Wayfinder's `@rbrasier/domain` as a workspace package
# (ADR-0001, Strategy A). We never commit Wayfinder source (validate.sh check
# #6), so CI checks Wayfinder out separately and materialises the packages we
# consume into vendor/wayfinder via scripts/vendor-wayfinder.sh — the non-Podman
# counterpart of what scripts/podman-run.sh does locally.
#
# Wayfinder repo/ref are configurable via repository variables so this works
# whether we track a personal fork (default) or the canonical upstream:
#   vars.WAYFINDER_REPO (default johntooth/wayfinder — public; matches the fork
#                        local dev vendors from, keeping CI and local in sync.
#                        Set to rbrasier/wayfinder to track upstream instead.)
#   vars.WAYFINDER_REF  (default main)
# johntooth/wayfinder is public, so the default GITHUB_TOKEN suffices. If you
# point WAYFINDER_REPO at a private repo, add a secret WAYFINDER_TOKEN (a PAT
# with contents:read on that repo).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redline
        uses: actions/checkout@v5

      - name: Checkout Wayfinder (read-only, for @rbrasier/* reuse)
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.WAYFINDER_REPO || 'johntooth/wayfinder' }}
          ref: ${{ vars.WAYFINDER_REF || 'main' }}
          token: ${{ secrets.WAYFINDER_TOKEN || github.token }}
          path: .wayfinder-src

      - name: Vendor Wayfinder domain into vendor/wayfinder
        run: WAYFINDER_DIR="$GITHUB_WORKSPACE/.wayfinder-src" scripts/vendor-wayfinder.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          # Node 22 (active LTS). The redline workspace targets Node >= 20; the
          # Podman harness and local validate.sh use node:20, and both 20 and 22
          # satisfy the toolchain. 22 keeps CI off the deprecated-on-runners 20.
          node-version: 22
          # No pnpm cache yet: caching needs a committed lockfile to key on, and
          # we don't commit one pre-1.0. setup-node@v5 turns package-manager
          # caching ON by default (v4 had it off), and with pnpm detected it
          # fails hard when pnpm-lock.yaml is absent — so disable it explicitly.
          # Flip to `cache: pnpm` once a lockfile lands.
          package-manager-cache: false

      - name: Install workspace dependencies
        # No committed lockfile yet (pre-1.0; the vendored @rbrasier/domain link
        # makes a stable checked-in lockfile fragile). Switch to --frozen-lockfile
        # once a lockfile is committed.
        run: pnpm install

      - name: Set up Python (womblex-ingest sidecar tests)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run validate.sh (typecheck, lint, test, build, static guards, pytest)
        run: ./validate.sh
