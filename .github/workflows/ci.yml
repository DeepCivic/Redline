# CI — the same gate as ./validate.sh, run on a real Node runner.
#
# redline consumes Wayfinder's `@rbrasier/domain` as a workspace package
# (ADR-0001, Strategy A). We never commit Wayfinder source (validate.sh check
# #6), so CI checks Wayfinder out separately and materialises the packages we
# consume into vendor/wayfinder via scripts/vendor-wayfinder.sh — the non-Podman
# counterpart of what scripts/podman-run.sh does locally.
#
# The Wayfinder repo and commit come from wayfinder.pin — one authoritative
# place, shared with scripts/vendor-wayfinder.sh, so CI and a local clone
# materialise byte-identical trees (ADR-0012). CI previously tracked a moving
# `main`, which let an upstream commit turn redline red with nothing changed
# here and no SHA to bisect against.
#
# To bump Wayfinder, edit wayfinder.pin — not this file. Repository variables
# still override for a one-off experiment:
#   vars.WAYFINDER_REPO / vars.WAYFINDER_REF
# rbrasier/wayfinder is public, so the default GITHUB_TOKEN suffices. If you
# point WAYFINDER_REPO at a private repo, add a secret WAYFINDER_TOKEN (a PAT
# with contents:read on that repo).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redline
        uses: actions/checkout@v5
        with:
          # services/womblex is a submodule pinned to the engine tag redline's
          # Parquet mapping is written against. Without it the tree has an empty
          # directory where the schema source of truth should be, and the
          # womblex pin-drift guard in validate.sh cannot run.
          submodules: true

      - name: Read the Wayfinder pin
        id: pin
        run: grep -E '^(repo|ref)=' wayfinder.pin >> "$GITHUB_OUTPUT"

      - name: Checkout Wayfinder (read-only, for @rbrasier/* reuse)
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.WAYFINDER_REPO || steps.pin.outputs.repo }}
          ref: ${{ vars.WAYFINDER_REF || steps.pin.outputs.ref }}
          token: ${{ secrets.WAYFINDER_TOKEN || github.token }}
          path: .wayfinder-src

      - name: Vendor Wayfinder domain into vendor/wayfinder
        run: WAYFINDER_DIR="$GITHUB_WORKSPACE/.wayfinder-src" scripts/vendor-wayfinder.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          # Node 22 (active LTS). The redline workspace targets Node >= 20; the
          # Podman harness and local validate.sh use node:20, and both 20 and 22
          # satisfy the toolchain. 22 keeps CI off the deprecated-on-runners 20.
          node-version: 22
          # pnpm-lock.yaml is committed, so store caching keys on it. Install
          # drops from a full resolve to a lockfile-reuse pass.
          cache: pnpm

      - name: Install workspace dependencies
        # --frozen-lockfile is safe now that wayfinder.pin fixes the vendored tree
        # to one commit (ADR-0012): the importer for
        # vendor/wayfinder/packages/domain is deterministic, so a stale lockfile
        # means *our* manifests moved — exactly what strictness should catch.
        # Before the pin this had to be --prefer-frozen-lockfile, because an
        # upstream dependency bump on a moving `main` staleness-failed the
        # install for a commit that was not ours.
        run: pnpm install --frozen-lockfile

      - name: Set up Python (womblex-ingest sidecar tests)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run validate.sh (typecheck, lint, test, build, static guards, pytest)
        # REQUIRE_WAYFINDER=1 turns an unresolvable @rbrasier/domain into a hard
        # failure instead of a skip. Wayfinder is an optional dependency so the
        # workspace installs without it (ADR-0012), which means the drift check
        # skips silently on a machine that has no vendored tree. CI is where that
        # must never happen — it is the only place the contract is re-derived.
        env:
          REQUIRE_WAYFINDER: "1"
        run: ./validate.sh
