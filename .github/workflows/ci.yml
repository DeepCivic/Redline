# CI — the same gate as ./validate.sh, run on a real Node runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redline
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          # Node 22 (active LTS). The redline workspace targets Node >= 20; the
          # Podman harness and local validate.sh use node:20, and both 20 and 22
          # satisfy the toolchain. 22 keeps CI off the deprecated-on-runners 20.
          node-version: 22
          # pnpm-lock.yaml is committed, so store caching keys on it. Install
          # drops from a full resolve to a lockfile-reuse pass.
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python (womblex-ingest sidecar tests)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run validate.sh (typecheck, lint, test, build, static guards, pytest)
        run: ./validate.sh
