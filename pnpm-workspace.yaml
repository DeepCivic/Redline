packages:
  - "apps/*"
  - "packages/*"
  # Strategy A: consume Wayfinder's unpublished `@rbrasier/*` workspace packages
  # through this shared workspace. `vendor/wayfinder` is NOT a submodule — it is
  # materialised at build time from wayfinder.pin by scripts/vendor-wayfinder.sh
  # and never committed (ADR-0012, validate.sh check #6).
  #
  # This glob is why pnpm-lock.yaml depends on whether that tree is present:
  # installing without it drops the vendor/wayfinder/packages/domain importer and
  # flips its transitive deps to `optional`. The committed lockfile is the
  # *vendored* one, which is what CI's --frozen-lockfile install expects. Vendor
  # before installing, or check #12 will catch the rewrite.
  - "vendor/wayfinder/packages/*"
