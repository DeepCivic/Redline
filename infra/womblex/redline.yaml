# redline's womblex pipeline config.
#
# Derived from the engine's own `configs/example.yaml` (services/womblex, the
# submodule) and trimmed to the stages redline consumes: extract -> chunk ->
# embed. Everything redline does not read is left disabled so a run does not pay
# for shards nothing consumes.
#
# `paths` are placeholders: under `womblex worker` the cloud runner stages each
# batch into a throwaway scratch dir and publishes the resulting shards back to
# WOMBLEX_STORE_URI, so these are only used by a local `womblex run`.
#
# Bump alongside the submodule — a config key the pinned engine does not know is
# a silent no-op, not an error.

dataset:
  name: redline

paths:
  input_root: /work/input
  output_root: /work/output
  checkpoint_dir: /work/checkpoints

detection:
  min_text_coverage: 0.3
  form_signal_threshold: 0.5
  table_signal_threshold: 0.4

extraction:
  native:
    # Tender responses carry pricing in tables; the table cells are what the
    # financial path reads (architecture.md §4, the join keys).
    include_tables: true
  ocr:
    # LOAD-BEARING, not a default. Reconstructing table cells inside a
    # layout-detected table rect needs per-detection OCR quads to bin into rows
    # and columns, and only region-based engines supply them. The LLM/VLM
    # engines (`mistral-ocr`, `ollama`) resolve reading order natively and
    # return markdown with no regions, so switching to one would silently
    # delete every table cell on a scanned page — and with it all pricing on
    # scanned tenders. See womblex `ingest/strategies_scanned.py` and
    # decisions.md "Table-cell reconstruction on OCR pages".
    engine: paddleocr
    dpi: 300
    lang: eng
    engine_options: {}

# redline never redacts — it evaluates tender responses it was given.
redaction:
  enabled: false

chunking:
  # AI chunking (semchunk 4): boundaries follow the Kanon-2 enricher's structure
  # spans instead of a 480-token budget split, so a chunk is a coherent unit —
  # required because the chunk is what says which thing a money figure relates
  # to, and a budget-cut chunk can straddle two line items or bisect one. This
  # is the corpus default, not an opt-in someone has to remember (delivery-plan
  # "Semantically bounded chunks, on by default").
  #
  # `chunking_model` set here means the stage was never keyless anyway — the
  # engine refuses without ISAACUS_API_KEY regardless (`run_chunking` /
  # `chunk_shards` return early when `isaacus_available()` is false), and `embed`
  # needs the key too. See architecture.md §7.1.
  #
  # Ordering matters: `chunking_model` auto-enables `enrichment.persist_document`
  # (WomblexConfig._wire_ai_chunking_reuse), and chunk reuses that Document only
  # if `enrich` already ran — the sidecar's `normalise_sequence` enforces enrich
  # before chunk whenever a chunking model is resolved (`run_trigger.py`), so a
  # run authored in any order avoids the double Isaacus charge a stray `chunk`
  # before `enrich` would otherwise cause.
  #
  # `enabled: false` is NOT "chunking is off" — it only gates `batch.py`'s
  # in-batch compute during `run`/`worker` (`operations/chunk.py:33`), which
  # `write_batch_parquet` discards unread (`DocumentResult.chunks` never reaches
  # a shard). `run-stage --stage chunk` (the pass that actually writes
  # `*.chunks.parquet`) never reads this flag — confirmed absent from
  # `process/chunk_stage.py` and `cloud/stage_contracts.py`'s chunk contract —
  # so real chunking is unaffected. With `chunking_model` unset this in-batch
  # compute-and-drop cost nothing but wall clock; with it set, leaving this
  # `true` would silently spend a full AI-chunking Isaacus call per document
  # during extraction, throw the result away, then pay for it again for real in
  # the chunk stage — the same double-charge shape as the enrich-ordering issue
  # above, from a different cause.
  tokenizer: "isaacus/kanon-2-tokenizer"
  chunking_model: kanon-2-enricher
  chunk_size: 480
  enabled: false
  chunk_tables: true

# Downstream text layers redline does not read.
normalise:
  collapse_whitespace: false
spellfix:
  enabled: false
pii:
  enabled: false
# The Kanon-2 entity/edge graph. ADR-0017 names it the navigation mechanic and
# delivery-plan items 3-7 read it, so it is on rather than off — but it is REAL
# Isaacus spend (`kanon-2-enricher`), unlike chunking's vendored tokeniser, and
# it is not part of `womblex run`/`worker`: it is a separate
# `run-stage --stage enrich` pass.
#
# Enrich now runs BEFORE chunk, because `chunking_model` above makes chunk reuse
# the Document enrich persists. Chunks are a non-strict input to enrich, so that
# order still succeeds — but it lands every entity with chunk_index = -1 and no
# mention->chunk edges, a graph that cannot be joined to chunk text. That is not
# left standing: the sidecar inserts `graph-refresh` after chunk whenever both
# stages run (`run_trigger.py`'s `normalise_sequence`), which rebuilds the edges
# offline from the char offsets both sidecars already carry. Reversing the two
# without also dropping `chunking_model` would reinstate the double enrichment
# charge; dropping `graph-refresh` would silently break the navigation mechanic.
enrichment:
  enabled: true

# Deliberately off, and NOT the same thing as enrichment. The graph comes from
# `enrich`; `link` writes *.entity_links.parquet, which nothing in redline
# reads, and its preflight hard-fails without a `linking.reference` register —
# a tender corpus has no register to point at.
linking:
  enabled: false

# The retrieval leg. `retrieval/document` is the task the chunk vectors must
# carry so the sidecar's query vectors (`retrieval/query`) are comparable
# (ADR-0014). Requires ISAACUS_API_KEY — without it no *.embeddings.parquet is
# produced and redline cannot retrieve (architecture.md §2).
embedding:
  enabled: true
  model: kanon-2-embedder
  task: retrieval/document

# ── The pricing leg ──────────────────────────────────────────────────────────
# LIVE as of the v0.3.0 submodule bump: the pinned engine defines `MoneyConfig`
# (services/womblex/src/womblex/config.py:521, mounted at `WomblexConfig.money`),
# so these keys are read rather than ignored. The redline side is built too — the
# money stage runs over object storage (`womblex run-stage --stage money`)
# and MoneySpanFinancialExtractor sums its spans into grid AUD.
#
# Not part of `womblex run`/`worker`: this is a separate per-stage command
# (`womblex money --shards <dir>`) run after the pipeline, writing
# *.money_spans.parquet + *.money_columns.parquet siblings. Offline and
# API-free — no Isaacus spend.
#
# Why it matters: the column-evidenced path recovers bare numbers whose
# money-ness comes from their column header, which womblex measures as ~98.7%
# of its corpus's amounts. A tender schedule headed `Unit Price ($)` over cells
# `4500`, `12000` is exactly that shape, and redline's marker-requiring seam
# derivation (ADR-0016) sees none of it.
money:
  enabled: true
  # Prose prices ("a fixed fee of $48,000 per annum"). redline has no other
  # route to these: the narrative locus carries char offsets in the same space
  # as chunks, so they map to (document, requirement) the way cells do.
  narrative: true
  default_currency: AUD
  # Australia does not use comma decimals. Mixed-denomination tenders remain a
  # known gap (ADR-0016 Consequences) — this setting does not address them.
  international_numbers: false
  # Bare numbers near financial vocabulary in *prose*. Upstream measures this as
  # low precision, and an invented price is worse than a missing one. Header
  # vocabulary — the high-value use of the same terms — is unaffected by this.
  implicit_context: false
  min_confidence: 0.5
  # null inherits processing.text_source (below), which is what keeps money
  # offsets in the same coordinate space as the chunks redline retrieves over.
  text_source: null

  columns:
    enabled: true
    numeric_fraction_min: 0.7
    min_cells: 3
    # STILL PROVISIONAL — and the first real corpus could not falsify them.
    # Run 2026-08-06 over the Technology PoC REOI + 3 responses: 42 columns
    # audited, verdicts 38 `insufficient` / 4 `vetoed` / **0 promoted**. Not one
    # header carried money vocabulary at all, so no term below was ever reached;
    # the 4 vetoes were `#` row-number columns, a built-in. All 65 money spans
    # came from prose (`narrative` locus, `p1` symbol-prefix evidence).
    #
    # The reading is about the corpus, not the terms: it contains no priced
    # tender schedule. These stay unvalidated until one runs that does.
    #
    # Header matching is whole-token, so `subtotal` is NOT covered by the
    # built-in `total`. The rest are tender-schedule vocabulary the built-in
    # set (price, cost, fee, charge, quote, total, gst, amount, payment) misses.
    extra_header_terms:
      - subtotal
      - rrp
      - extended
      - disbursement
      - disbursements
      - freight
    # A veto is only needed for headers that WOULD otherwise be promoted — i.e.
    # ones carrying money vocabulary while not being money. A bare `Qty` column
    # needs no veto because nothing promotes it in the first place. These are
    # the tender headers that collide with the built-in money terms:
    #   `Cost Centre` (cost), `Payment Terms` (payment), `Value Rating` (value),
    #   `Price Band` (price), `Value Weighting` (value).
    # Each is still escaped by a header declaring its own currency, so
    # `Warranty ($)` survives — the veto check yields to `header_currency`.
    extra_veto_terms:
      - centre
      - center
      - terms
      - rating
      - band
      - weighting

processing:
  batch_size: 25
  checkpoint_every: 25
  text_source: elements
  retention:
    policy: rolling
    keep: 2
