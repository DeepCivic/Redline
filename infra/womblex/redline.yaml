# redline's womblex pipeline config.
#
# Derived from the engine's own `configs/example.yaml` (services/womblex, the
# submodule) and trimmed to the stages redline consumes: extract -> chunk ->
# embed. Everything redline does not read is left disabled so a run does not pay
# for shards nothing consumes.
#
# `paths` are placeholders: under `womblex worker` the cloud runner stages each
# batch into a throwaway scratch dir and publishes the resulting shards back to
# WOMBLEX_STORE_URI, so these are only used by a local `womblex run`.
#
# Bump alongside the submodule — a config key the pinned engine does not know is
# a silent no-op, not an error.

dataset:
  name: redline

paths:
  input_root: /work/input
  output_root: /work/output
  checkpoint_dir: /work/checkpoints

detection:
  min_text_coverage: 0.3
  form_signal_threshold: 0.5
  table_signal_threshold: 0.4

extraction:
  native:
    # Tender responses carry pricing in tables; the table cells are what the
    # financial path reads (architecture.md §4, the join keys).
    include_tables: true
  ocr:
    # LOAD-BEARING, not a default. Reconstructing table cells inside a
    # layout-detected table rect needs per-detection OCR quads to bin into rows
    # and columns, and only region-based engines supply them. The LLM/VLM
    # engines (`mistral-ocr`, `ollama`) resolve reading order natively and
    # return markdown with no regions, so switching to one would silently
    # delete every table cell on a scanned page — and with it all pricing on
    # scanned tenders. See womblex `ingest/strategies_scanned.py` and
    # decisions.md "Table-cell reconstruction on OCR pages".
    engine: paddleocr
    dpi: 300
    lang: eng
    engine_options: {}

# redline never redacts — it evaluates tender responses it was given.
redaction:
  enabled: false

chunking:
  # Token chunking, no `chunking_model` — so no AI-chunking API call is made. That
  # does NOT make the stage keyless: upstream refuses the whole stage without one.
  # `run_chunking` / `chunk_shards` return early when `isaacus_available()` is
  # false (a network-free check for the isaacus package + ISAACUS_API_KEY), before
  # any tokeniser is loaded — even though the engine vendors the Kanon-2 tokeniser
  # in-tree at src/womblex/_models/kanon-2-tokenizer/ and prefers it offline.
  # A policy gate, not a capability limit; see architecture.md §7.1. Moot in
  # practice, since `embed` needs the key anyway.
  tokenizer: "isaacus/kanon-2-tokenizer"
  chunk_size: 480
  enabled: true
  chunk_tables: true

# Downstream text layers redline does not read.
normalise:
  collapse_whitespace: false
spellfix:
  enabled: false
pii:
  enabled: false
enrichment:
  enabled: false
linking:
  enabled: false

# The retrieval leg. `retrieval/document` is the task the chunk vectors must
# carry so the sidecar's query vectors (`retrieval/query`) are comparable
# (ADR-0014). Requires ISAACUS_API_KEY — without it no *.embeddings.parquet is
# produced and redline cannot retrieve (architecture.md §2).
embedding:
  enabled: true
  model: kanon-2-embedder
  task: retrieval/document

# ── The pricing leg ──────────────────────────────────────────────────────────
# LIVE as of the v0.3.0 submodule bump: the pinned engine defines `MoneyConfig`
# (services/womblex/src/womblex/config.py:521, mounted at `WomblexConfig.money`),
# so these keys are read rather than ignored. The redline side is built too — the
# money stage runs over object storage (services/womblex-ingest money_stage.py)
# and MoneySpanFinancialExtractor sums its spans into grid AUD.
#
# Not part of `womblex run`/`worker`: this is a separate per-stage command
# (`womblex money --shards <dir>`) run after the pipeline, writing
# *.money_spans.parquet + *.money_columns.parquet siblings. Offline and
# API-free — no Isaacus spend.
#
# Why it matters: the column-evidenced path recovers bare numbers whose
# money-ness comes from their column header, which womblex measures as ~98.7%
# of its corpus's amounts. A tender schedule headed `Unit Price ($)` over cells
# `4500`, `12000` is exactly that shape, and redline's marker-requiring seam
# derivation (ADR-0016) sees none of it.
money:
  enabled: true
  # Prose prices ("a fixed fee of $48,000 per annum"). redline has no other
  # route to these: the narrative locus carries char offsets in the same space
  # as chunks, so they map to (document, requirement) the way cells do.
  narrative: true
  default_currency: AUD
  # Australia does not use comma decimals. Mixed-denomination tenders remain a
  # known gap (ADR-0016 Consequences) — this setting does not address them.
  international_numbers: false
  # Bare numbers near financial vocabulary in *prose*. Upstream measures this as
  # low precision, and an invented price is worse than a missing one. Header
  # vocabulary — the high-value use of the same terms — is unaffected by this.
  implicit_context: false
  min_confidence: 0.5
  # null inherits processing.text_source (below), which is what keeps money
  # offsets in the same coordinate space as the chunks redline retrieves over.
  text_source: null

  columns:
    enabled: true
    numeric_fraction_min: 0.7
    min_cells: 3
    # PROVISIONAL — tune against *.money_columns.parquet on the first real
    # corpus; that sidecar is the per-column verdict audit and is
    # the surface that makes these falsifiable.
    #
    # Header matching is whole-token, so `subtotal` is NOT covered by the
    # built-in `total`. The rest are tender-schedule vocabulary the built-in
    # set (price, cost, fee, charge, quote, total, gst, amount, payment) misses.
    extra_header_terms:
      - subtotal
      - rrp
      - extended
      - disbursement
      - disbursements
      - freight
    # A veto is only needed for headers that WOULD otherwise be promoted — i.e.
    # ones carrying money vocabulary while not being money. A bare `Qty` column
    # needs no veto because nothing promotes it in the first place. These are
    # the tender headers that collide with the built-in money terms:
    #   `Cost Centre` (cost), `Payment Terms` (payment), `Value Rating` (value),
    #   `Price Band` (price), `Value Weighting` (value).
    # Each is still escaped by a header declaring its own currency, so
    # `Warranty ($)` survives — the veto check yields to `header_currency`.
    extra_veto_terms:
      - centre
      - center
      - terms
      - rating
      - band
      - weighting

processing:
  batch_size: 25
  checkpoint_every: 25
  text_source: elements
  retention:
    policy: rolling
    keep: 2
