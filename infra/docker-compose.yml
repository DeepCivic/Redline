# redline runtime stack — womblex + numbatch + postgres + minio, wired with
# compose profiles so you bring up only what a given thread needs.
#
# Per ADR-0002, redline owns its own MinIO and Postgres; the seam stays plain
# S3/Postgres so a deployment can repoint these at a shared instance by config.
#
# Credentials use dev defaults (minioadmin / a dev password) so ANY single
# profile comes up standalone — compose interpolates the whole file regardless of
# --profile, so an unrelated profile's secret must not block `--profile ingest`.
# Production MUST override these via infra/.env (copy infra/.env.example); never
# ship the dev defaults.
#
# Profiles:
#   ingest    — womblex-ingest + minio + redline-postgres (the ingestion path;
#               an ingest lands the MinIO shards AND projects chunks + embeddings
#               into the redline_ chunk store — item 1a, ADR-0017/0018)
#   money     — the money annotation step (run on demand after a womblex run):
#               stages an evaluation's shards down, runs `womblex money`,
#               publishes the *.money_spans/*.money_columns siblings back and
#               loads the spans into redline_money_spans
#               (`compose --profile money run --rm money --evaluation-id <id>`).
#               Needs the `[womblex]` extra, so it builds its own image target.
#   womblex   — the real womblex engine, built from the ../services/womblex
#               submodule using ITS OWN Dockerfile and run through ITS OWN cloud
#               runner (Postgres job queue + scalable `worker`), sharing MinIO.
#               womblex is a REQUIRED subsystem (Finding 2 / D5) with a heavy
#               OCR/tokeniser/model runtime, so it stays out of the API sidecar's
#               image. It extracts + chunks (+ embeds when ISAACUS_API_KEY is set)
#               an enqueued corpus and publishes the shards under
#               proc/{evaluationId}/. Scale with `up --scale womblex=4 womblex`.
#   numbatch  — the Numbatch stack, all-but-frontend: postgres + redis + minio +
#               backend API + Arq worker + inference service + one-shot migrate
#               (ADR-0004/ADR-0005 — the SvelteKit frontend is excluded,
#               redline owns its own control surface). Builds from the
#               ../services/numbatch submodule using ITS OWN infra/docker/*.Dockerfile
#               — run `git submodule update --init` first (see services/README.md).
#   report    — the report tool surface: redline's seven read ports served as an
#               MCP server over streamable HTTP (apps/redline-mcp), for a
#               report-assembler LLM inside Wayfinder. Shares REDLINE_DATABASE_URL
#               with the ingest sidecar and reads it read-only. Bring `ingest` up
#               too if the extraction tools are wanted — the four store-backed
#               tools need no sidecar.
#   redline   — redline's own Postgres for the redline_ schema (ADR-0002).
#
# Usage (Thread 3 exit test):
#   podman compose -f infra/docker-compose.yml --profile ingest up -d
#   ../scripts/thread-03-smoke.sh
#   podman compose -f infra/docker-compose.yml --profile ingest down -v
#
# Usage (Numbatch stack):
#   podman compose -f infra/docker-compose.yml --profile numbatch up -d
#   # backend API on :8080, inference on :8100 (frontend is NOT started)

name: redline

# The womblex engine's own env contract, lifted verbatim from the submodule's
# docker-compose.yml so the two read side by side. WOMBLEX_STORE_URI is rooted at
# redline's evaluation prefix, so the engine's native runs/<run_id>/documents/
# layout lands *under* proc/{evaluationId}/ and the sidecar's suffix-based shard
# discovery finds it unchanged (ADR-0002 keeps object storage the only seam).
x-womblex-env: &womblex-env
  WOMBLEX_DB_DSN: postgresql://womblex:womblex@womblex-queue:5432/womblex
  WOMBLEX_STORE_URI: s3://${REDLINE_BUCKET:-redline}/proc/${WOMBLEX_EVAL_ID:-womblex-pod}
  WOMBLEX_S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
  AWS_REGION: us-east-1
  # Engages the embed stage (kanon-2-embedder); *.embeddings.parquet — the
  # retrieval sibling — is only produced when this is set.
  ISAACUS_API_KEY: ${ISAACUS_API_KEY:-}

services:
  minio:
    image: docker.io/minio/minio:latest
    # Every profile whose services depend_on minio must list it, or compose
    # rejects the project outright ("depends on undefined service").
    profiles: ["ingest", "numbatch", "womblex", "womblex-cli", "money"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The lightweight FastAPI read seam (Parquet→JSON). It stays light: the real
  # womblex engine is its own pod (the `womblex` service below), never baked into
  # this image. WOMBLEX_MODE=real selects the real extractor, which
  # reads the shards the womblex pod produced.
  womblex-ingest:
    build:
      context: ../services/womblex-ingest
      dockerfile: Dockerfile
      target: sidecar
    profiles: ["ingest"]
    depends_on:
      minio:
        condition: service_healthy
      redline-postgres:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      REDLINE_BUCKET: ${REDLINE_BUCKET:-redline}
      # stub is the dependency-free TEST DOUBLE (fast CI, the Thread 4 adapter
      # contract). redline's real deployment runs the womblex pod + WOMBLEX_MODE=real.
      WOMBLEX_MODE: ${WOMBLEX_MODE:-stub}
      ISAACUS_API_KEY: ${ISAACUS_API_KEY:-}
      # redline's own Postgres (ADR-0002). When set, an ingest projects its
      # chunks + embeddings into the `redline_` chunk store (item 1a) alongside
      # the MinIO shards, so the cold-start classifier (item 1b) can fetch them
      # by provenance. Points at the redline-postgres service, which the `ingest`
      # profile brings up beside the sidecar. Unset it to run shards-only.
      REDLINE_DATABASE_URL: ${REDLINE_DATABASE_URL:-postgresql://${REDLINE_DB_USER:-redline}:${REDLINE_DB_PASSWORD:-redline-dev}@redline-postgres:5432/${REDLINE_DB_NAME:-redline}}
    ports:
      - "8000:8000"

  # ── money annotation step ─────────────────────────────────────────────────
  # Not part of `womblex run`/`worker`: the money op is offline, API-free and has
  # no ordering dependency on the pipeline, so it runs ON DEMAND once the fleet
  # has drained — the same lifecycle as `womblex finalize`. It stages an
  # evaluation's `*.elements`/`*.table_cells` shards down from object storage,
  # runs womblex's own `money_shards()`, publishes the two sidecars back beside
  # them, and lands the spans in `redline_money_spans`. Unlike the read-seam
  # sidecar above, this needs `womblex` installed, so it builds the `[womblex]`
  # image target.
  #
  #   podman compose -f infra/docker-compose.yml --profile money \
  #     run --rm money --evaluation-id <evaluationId>
  money:
    build:
      context: ../services/womblex-ingest
      dockerfile: Dockerfile
      target: womblex
    profiles: ["money"]
    depends_on:
      minio:
        condition: service_healthy
      redline-postgres:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      REDLINE_BUCKET: ${REDLINE_BUCKET:-redline}
      # The `money:` section (vocabulary, vetoes, currency default) is read from
      # the same config the womblex worker runs with, so redline never restates
      # the engine's tuning.
      WOMBLEX_CONFIG: /app/redline-config/redline.yaml
      # Where the annotated spans land. `redline_money_spans` is created by
      # redline-adapters' migrations, so this expects a migrated database. Unset
      # it to publish the sidecars and skip the load — but note the load only
      # happens as part of this stage, so picking those sidecars up afterwards
      # means running the stage again (offline and API-free, so cheap).
      REDLINE_DATABASE_URL: ${REDLINE_DATABASE_URL:-postgresql://${REDLINE_DB_USER:-redline}:${REDLINE_DB_PASSWORD:-redline-dev}@redline-postgres:5432/${REDLINE_DB_NAME:-redline}}
    volumes:
      - ./womblex:/app/redline-config:ro
    entrypoint: ["python", "-m", "womblex_ingest.money_stage"]

  # ── the report tool surface (MCP) ─────────────────────────────────────────
  # redline's seven read ports served as an MCP server over streamable HTTP, for a
  # report-assembler LLM running inside Wayfinder. Wayfinder's MCP client speaks
  # SSE and streamable-HTTP only (no stdio) and addresses servers by URL, so this
  # is a long-running service with a URL, not a process the fork spawns.
  #
  # It shares `REDLINE_DATABASE_URL` with the sidecar above — same store, read
  # only — and reads one document's extraction through the sidecar's JSON seam
  # rather than linking a Parquet reader of its own.
  #
  # Register it in Wayfinder with transport `streamable-http`, url
  # http://redline-mcp:8930/mcp, and communicatesExternally FALSE: it talks to
  # redline's own Postgres inside this deployment and sends nothing out, so it is
  # the self-contained internal utility that flag's `false` branch describes. An
  # external server is registered but NOT selectable in flows, which would make
  # the assembler unbuildable.
  #
  #   podman compose -f infra/docker-compose.yml --profile report up -d
  redline-mcp:
    build:
      context: ..
      dockerfile: apps/redline-mcp/Dockerfile
    profiles: ["report"]
    depends_on:
      redline-postgres:
        condition: service_healthy
    environment:
      REDLINE_DATABASE_URL: ${REDLINE_DATABASE_URL:-postgresql://${REDLINE_DB_USER:-redline}:${REDLINE_DB_PASSWORD:-redline-dev}@redline-postgres:5432/${REDLINE_DB_NAME:-redline}}
      # The read seam for elements / chunks / table cells. The sidecar belongs to
      # the `ingest` profile, so bring both up when the extraction tools are
      # wanted; the four store-backed tools work without it.
      WOMBLEX_INGEST_URL: ${WOMBLEX_INGEST_URL:-http://womblex-ingest:8000}
      REDLINE_MCP_PORT: "8930"
    ports:
      - "8930:8930"

  # ── womblex engine (the submodule's OWN image) ────────────────────────────
  # The REAL womblex pipeline (extract → chunk → embed), built from
  # ../services/womblex (the submodule) using the ENGINE'S OWN Dockerfile and
  # run through its OWN cloud runner: a Postgres job queue + `enqueue` + a
  # horizontally scalable `worker` that stages each batch out of object storage,
  # runs the pipeline, and publishes the shards back (womblex `cloud/worker.py`).
  #
  # redline deliberately does NOT wrap this. The engine already ships the image,
  # the S3/MinIO staging (`store/remote.py`, fsspec) and the retry/scale-out
  # semantics; an earlier redline-owned Dockerfile + shell entrypoint duplicated
  # all three and is retired.
  #
  # The env contract is womblex's (see `x-womblex-env` above, copied from its own
  # compose so the two stay readable side by side).

  # The engine's job queue. Its own instance so `--profile womblex` still comes
  # up standalone (see the credentials note in this file's header).
  womblex-queue:
    image: docker.io/library/postgres:16
    profiles: ["womblex", "womblex-cli"]
    environment:
      POSTGRES_USER: womblex
      POSTGRES_PASSWORD: womblex
      POSTGRES_DB: womblex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U womblex"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the queue schema (`womblex jobs --create-schema`).
  womblex-init:
    build:
      context: ../services/womblex
      # `isaacus` is NOT optional for redline. isaacus_available() gates the chunk
      # stage on the SDK being importable as well as a key being set, so the
      # image's default EXTRAS=cloud would skip chunking entirely and land
      # extraction shards with no chunks for the classifier to read.
      args:
        EXTRAS: cloud,isaacus
    profiles: ["womblex"]
    depends_on:
      womblex-queue:
        condition: service_healthy
    environment: *womblex-env
    command: ["jobs", "--create-schema"]

  # General-purpose CLI entry — `enqueue` a corpus, `finalize` a run. Run on
  # demand (`compose run --rm womblex-cli enqueue ...`), never `up`.
  womblex-cli:
    build:
      context: ../services/womblex
      # `isaacus` is NOT optional for redline. isaacus_available() gates the chunk
      # stage on the SDK being importable as well as a key being set, so the
      # image's default EXTRAS=cloud would skip chunking entirely and land
      # extraction shards with no chunks for the classifier to read.
      args:
        EXTRAS: cloud,isaacus
    profiles: ["womblex-cli"]
    depends_on:
      minio:
        condition: service_healthy
      womblex-queue:
        condition: service_healthy
    environment: *womblex-env
    volumes:
      - ./womblex:/app/redline-config:ro

  # The engine itself. Scale horizontally: `up --scale womblex=4 womblex`.
  womblex:
    build:
      context: ../services/womblex
      # `isaacus` is NOT optional for redline. isaacus_available() gates the chunk
      # stage on the SDK being importable as well as a key being set, so the
      # image's default EXTRAS=cloud would skip chunking entirely and land
      # extraction shards with no chunks for the classifier to read.
      args:
        EXTRAS: cloud,isaacus
    profiles: ["womblex"]
    depends_on:
      womblex-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment: *womblex-env
    volumes:
      - ./womblex:/app/redline-config:ro
    command: ["worker", "--config", "/app/redline-config/redline.yaml",
              "--poll-interval", "5", "--stale-timeout", "900"]

  # ── Numbatch stack (all-but-frontend) ─────────────────────────────────────
  # The DeepCivic/Numbatch fork, consumed as a submodule at ../services/numbatch
  # and built with the ENGINE'S OWN infra/docker/*.Dockerfile — redline supplies
  # no Dockerfile of its own here (D14). We run its backend + Arq worker +
  # inference service; the SvelteKit frontend is never started — redline owns its
  # own UI (ADR-0005). Numbatch reads the same MinIO: its ingestion feed accepts
  # womblex *.chunks.parquet directly (POST /ingestion/womblex-configs/{id}/upload,
  # s3_womblex_bucket), pointed at redline's `proc/{evaluationId}/` chunks.
  #
  # redline's OWN additive overlay is NOT here — it lives in
  # ../services/numbatch-extension and grafts onto this tree (ADR-0005).

  numbatch-postgres:
    image: docker.io/library/postgres:16
    profiles: ["numbatch"]
    environment:
      POSTGRES_USER: ${NUMBATCH_DB_USER:-numbatch}
      POSTGRES_PASSWORD: ${NUMBATCH_DB_PASSWORD:-numbatch-dev}
      POSTGRES_DB: ${NUMBATCH_DB_NAME:-numbatch}
    volumes:
      - numbatch-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NUMBATCH_DB_USER:-numbatch} -d ${NUMBATCH_DB_NAME:-numbatch}"]
      interval: 5s
      timeout: 5s
      retries: 12

  numbatch-redis:
    image: docker.io/library/redis:7
    profiles: ["numbatch"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot Alembic migration; the backend/worker wait on it completing.
  numbatch-migrate:
    build:
      context: ../services/numbatch
      dockerfile: infra/docker/backend.Dockerfile
    profiles: ["numbatch"]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      numbatch-postgres:
        condition: service_healthy
    environment: &numbatch-backend-env
      DATABASE_URL: postgresql+asyncpg://${NUMBATCH_DB_USER:-numbatch}:${NUMBATCH_DB_PASSWORD:-numbatch-dev}@numbatch-postgres:5432/${NUMBATCH_DB_NAME:-numbatch}
      REDIS_URL: redis://numbatch-redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ADAPTERS_BUCKET: ${NUMBATCH_ADAPTERS_BUCKET:-numbatch-adapters}
      S3_WOMBLEX_BUCKET: ${REDLINE_BUCKET:-redline}
      INFERENCE_URL: http://numbatch-inference:8100

  numbatch-backend:
    build:
      context: ../services/numbatch
      dockerfile: infra/docker/backend.Dockerfile
    profiles: ["numbatch"]
    depends_on:
      numbatch-migrate:
        condition: service_completed_successfully
      numbatch-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *numbatch-backend-env
    ports:
      - "8080:8000"

  # The Arq worker shares the backend image/package; runs training + ingestion +
  # batch-inference tasks. GPU split is a deployment change, not a code change.
  numbatch-worker:
    build:
      context: ../services/numbatch
      dockerfile: infra/docker/backend.Dockerfile
    profiles: ["numbatch"]
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      numbatch-migrate:
        condition: service_completed_successfully
      numbatch-redis:
        condition: service_healthy
    environment: *numbatch-backend-env

  # DB-free inference service (ADR-0017); own image (torch/PEFT footprint).
  numbatch-inference:
    build:
      context: ../services/numbatch
      dockerfile: infra/docker/inference.Dockerfile
    profiles: ["numbatch"]
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ADAPTERS_BUCKET: ${NUMBATCH_ADAPTERS_BUCKET:-numbatch-adapters}
      BASE_MODEL_NAME: ${NUMBATCH_BASE_MODEL:-answerdotai/ModernBERT-base}
      DEVICE: ${NUMBATCH_DEVICE:-auto}
    ports:
      - "8100:8100"

  # ── redline's own Postgres (the redline_ schema) ──────────────────────────
  # ADR-0002: redline owns its Postgres, separate from Numbatch's. Tables use the
  # redline_ prefix. Migrations run via the adapters db:migrate script against
  # DATABASE_URL; the seam stays plain Postgres so a deployment can repoint it.
  redline-postgres:
    image: docker.io/library/postgres:16
    profiles: ["ingest", "money", "redline", "report"]
    environment:
      POSTGRES_USER: ${REDLINE_DB_USER:-redline}
      POSTGRES_PASSWORD: ${REDLINE_DB_PASSWORD:-redline-dev}
      POSTGRES_DB: ${REDLINE_DB_NAME:-redline}
    volumes:
      - redline-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REDLINE_DB_USER:-redline} -d ${REDLINE_DB_NAME:-redline}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  minio-data:
  numbatch-postgres-data:
  redline-postgres-data:
