# redline runtime stack — the read path, and nothing else.
#
# redline is a read-only MCP server over Womblex's extraction assets. It stores
# nothing of its own, so this stack is object storage plus the two processes that
# read it: the Parquet→JSON sidecar and the MCP surface in front of it.
#
# **The Womblex engine is not here.** It is a separate product with its own repo,
# image and runner, and redline reaches it only through object storage — it
# publishes shards under proc/{corpusId}/runs/{runId}/, redline reads them back.
# Point the engine at this MinIO (or at whatever S3 both share) and give it
# `infra/womblex/redline.yaml`, which is the run profile redline's reads assume.
# See docs/Womblex-Output-Contract.md for the assets that run must land.
#
# Credentials use dev defaults (minioadmin / a dev password) so any single
# profile comes up standalone — compose interpolates the whole file regardless of
# --profile, so an unrelated profile's secret must not block `--profile ingest`.
# Production MUST override these via infra/.env (copy infra/.env.example); never
# ship the dev defaults.
#
# Profiles:
#   ingest — womblex-ingest + minio: serves the run-scoped Parquet→JSON read seam
#   report — apps/redline-mcp: the MCP tool surface over that seam. Bring `ingest`
#            up too, so there is a sidecar at WOMBLEX_INGEST_URL to read from
#
# Usage:
#   podman compose -f infra/docker-compose.yml --profile ingest up -d
#   scripts/ingest-smoke.sh
#   podman compose -f infra/docker-compose.yml --profile ingest down -v

name: redline

services:
  minio:
    image: docker.io/minio/minio:latest
    # Every profile whose services depend_on minio must list it, or compose
    # rejects the project outright ("depends on undefined service").
    profiles: ["ingest"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The lightweight FastAPI read seam (Parquet→JSON). It stays light on purpose:
  # the Womblex runtime (PyMuPDF, OCR, the Kanon tokeniser, model weights) is far
  # heavier than this API layer, and keeping the coupling to object storage means
  # this image never carries it. WOMBLEX_MODE=real reads the shards the engine
  # landed; `stub` is a dependency-free test double.
  womblex-ingest:
    build:
      context: ../services/womblex-ingest
      dockerfile: Dockerfile
      target: sidecar
    profiles: ["ingest"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      REDLINE_BUCKET: ${REDLINE_BUCKET:-redline}
      # stub is the dependency-free TEST DOUBLE (fast CI, the adapter contract
      # test). A real deployment runs the Womblex engine and sets this to `real`.
      WOMBLEX_MODE: ${WOMBLEX_MODE:-stub}
    ports:
      - "8000:8000"

  # ── the MCP tool surface ──────────────────────────────────────────────────
  # Womblex's extraction assets served verbatim to an MCP client. Clients address
  # this server by URL over SSE or streamable HTTP — there is no stdio transport —
  # so it is a long-running service, not a process a client spawns.
  #
  # Register it with transport `streamable-http` at http://redline-mcp:8930/mcp.
  # Where a client classifies servers by egress, this one is INTERNAL: it reads
  # object storage inside this deployment and sends nothing anywhere.
  #
  #   podman compose -f infra/docker-compose.yml --profile report up -d
  redline-mcp:
    build:
      context: ..
      dockerfile: apps/redline-mcp/Dockerfile
    profiles: ["report"]
    environment:
      WOMBLEX_INGEST_URL: ${WOMBLEX_INGEST_URL:-http://womblex-ingest:8000}
      REDLINE_MCP_PORT: "8930"
    ports:
      - "8930:8930"

volumes:
  minio-data:
