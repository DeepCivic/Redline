# Run-capable womblex-ingest sidecar — the missing piece for a browser-fired run.
#
# WHY THIS EXISTS: the `ingest`-profile `womblex-ingest` service builds the light,
# womblex-free `sidecar` image and sets no WOMBLEX_DB_DSN / WOMBLEX_STORE_URI, so
# its POST /runs route 503s ("run trigger is not configured") and it cannot import
# the engine the trigger drives. A browser-fired corpus run (the Create Corpus
# tab) needs a sidecar that (a) has the engine installed and (b) has the trigger
# env wired. That is exactly the `money` image (installs the engine from the
# services/womblex submodule source + the sidecar package) served as the FastAPI
# app instead of the one-shot money entrypoint.
#
# It is additive local scaffolding for the run-stack E2E, matching infra/uat's
# posture ("this host has no local Node") — it is not a shipped topology. The
# read-seam sidecar the shipped `ingest` profile runs stays exactly as it is.
#
# Bring it up ON TOP of the ingest profile (which provides minio + redline-postgres
# + womblex-queue's siblings) — note it also needs the engine's job queue, so the
# `womblex` profile's womblex-queue + womblex-init must be up too:
#
#   podman compose -f infra/docker-compose.yml --profile ingest --profile womblex up -d
#   podman compose -f infra/docker-compose.yml -f infra/docker-compose.run-sidecar.yml \
#     up -d --build womblex-run-sidecar
#
# The fork web app then points REDLINE_WOMBLEX_INGEST_URL at http://womblex-run-sidecar:8000.

name: redline

services:
  womblex-run-sidecar:
    build:
      context: ..
      dockerfile: infra/docker/womblex-money.Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      redline-postgres:
        condition: service_healthy
      womblex-queue:
        condition: service_healthy
    environment:
      # The read-seam settings (identical to the ingest sidecar): real extractor,
      # redline's own store for the chunk projection, real Isaacus key.
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      REDLINE_BUCKET: ${REDLINE_BUCKET:-redline}
      WOMBLEX_MODE: real
      ISAACUS_API_KEY: ${ISAACUS_API_KEY:-}
      REDLINE_DATABASE_URL: ${REDLINE_DATABASE_URL:-postgresql://${REDLINE_DB_USER:-redline}:${REDLINE_DB_PASSWORD:-redline-dev}@redline-postgres:5432/${REDLINE_DB_NAME:-redline}}
      # The trigger's coupling to the engine (the second engine seam). The store
      # URI is the BUCKET ROOT — the trigger composes proc/{eval}/inputs and
      # proc/{eval}/runs/{runId} under it itself (run_trigger.py _input_prefix /
      # _output_prefix), so a store URI already rooted at proc/... would double up.
      WOMBLEX_DB_DSN: postgresql://womblex:womblex@womblex-queue:5432/womblex
      WOMBLEX_STORE_URI: s3://${REDLINE_BUCKET:-redline}
      WOMBLEX_CONFIG: /app/redline-config/redline.yaml
      # The engine's RemoteStore reads the standard AWS_* vars + WOMBLEX_S3_ENDPOINT
      # for an s3:// store (womblex store/remote.py storage_options_from_env).
      WOMBLEX_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      AWS_REGION: us-east-1
    volumes:
      # redline.yaml — the same config the worker runs with (WOMBLEX_CONFIG). `:z`
      # relabels for SELinux, lowercase so the money/stage mounts of the same dir
      # do not lock each other out.
      - ./womblex:/app/redline-config:z
    # Serve the FastAPI app instead of the money-stage one-shot the image defaults
    # to. uvicorn is a base dep of the sidecar package, present in this image.
    entrypoint: ["uvicorn", "womblex_ingest.asgi:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
